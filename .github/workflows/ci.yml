name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck install.sh and tests
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "."
          ignore_paths: "supabase/.temp"
          # Only fail on real problems -- info/style notes (SC1001,
          # SC2016, SC2001) are pre-existing, harmless, and confirmed
          # locally; failing CI on those would just be permanent noise.
          severity: warning

  install-smoke-test:
    # ubuntu-latest only, deliberately -- macos-latest here consistently
    # timed out (curl: (28) Connection timed out) connecting to the local
    # mock server on 127.0.0.1, even after disabling the Application
    # Firewall (confirmed that wasn't the cause: still failed identically
    # with it off). This is GitHub's hosted macOS runner blocking loopback
    # traffic at some level below what socketfilterfw controls, not a bug
    # in install.sh -- the exact same test passes locally on real macOS
    # every time. macOS coverage is verified manually before each release
    # instead (see INSTALLER_CHANGELOG.md 2.0.1 and 2.0.0 for what that
    # covered, including a real curl against production).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh against a local mock release
        run: ./tests/install-smoke-test.sh

  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the check-in Edge Function
        run: deno check supabase/functions/check-in/index.ts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for accidentally committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
