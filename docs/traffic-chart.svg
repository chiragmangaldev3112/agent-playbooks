<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .title { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .label { fill: #6e7781; font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .title { fill: #e6edf3; }
      .label { fill: #8b949e; }
    }
  </style>
  <rect class="bg" width="860" height="200" rx="8"/>
  <text x="430" y="96" text-anchor="middle" class="title">First daily run pending</text>
  <text x="430" y="118" text-anchor="middle" class="label">This chart fills in automatically once .github/workflows/traffic.yml runs</text>
  <text x="430" y="134" text-anchor="middle" class="label">(needs a TRAFFIC_PAT secret — see that file's header comment — then "Run workflow" once)</text>
</svg>
